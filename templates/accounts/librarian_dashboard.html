<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Librarian Dashboard</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f6f9;
}

.sidebar{
    width:260px;
    height:100vh;
    background:#2c3e50;
    color:#fff;
    position:fixed;
    padding-top:20px;
}

.sidebar h2{
    text-align:center;
    margin-bottom:30px;
}

.sidebar ul{
    list-style:none;
}

.sidebar ul li{
    padding:15px 20px;
    border-bottom:1px solid rgba(255,255,255,0.1);
}

.sidebar ul li a{
    color:white;
    text-decoration:none;
    display:block;
}

.sidebar ul li:hover{
    background:#34495e;
}

.main{
    margin-left:260px;
    padding:20px;
}

.header{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
    margin-bottom:20px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    text-align:center;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.card h3{
    margin-bottom:15px;
    color:#2c3e50;
}

.card button{
    padding:10px 15px;
    border:none;
    background:#3498db;
    color:white;
    border-radius:5px;
    cursor:pointer;
}

.card button:hover{
    background:#2980b9;
}
</style>
</head>
<body>

<div class="sidebar">
    <h2>Librarian Panel</h2>
    <ul>
        <li><a href="#">View Students</a></li>
        <li><a href="#">Books Taken By Students</a></li>
        <li><a href="#">Add Book</a></li>
        <li><a href="#">Manage Books</a></li>
        <li><a href="#">Accept Borrow Request</a></li>
        <li><a href="#">Reject Borrow Request</a></li>
        <li><a href="#">Logout</a></li>
    </ul>
</div>

<div class="main">
    <div class="header">
        <h1>Librarian Dashboard</h1>
    </div>

    <div class="cards">

        <div class="card">
            <h3>View Students</h3>
            <button>Open</button>
        </div>

        <div class="card">
            <h3>Books Taken By Students</h3>
            <button>Open</button>
        </div>

        <div class="card">
            <h3>Add Book</h3>
            <button>Add</button>
        </div>

        <div class="card">
            <h3>Manage Books</h3>
            <button>Manage</button>
        </div>

        <div class="card">
            <h3>Accept Borrow Request</h3>
            <button>Accept</button>
        </div>

        <div class="card">
            <h3>Reject Borrow Request</h3>
            <button>Reject</button>
        </div>

    </div>
</div>

</body>
</html>
