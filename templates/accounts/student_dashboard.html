<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Dashboard</title>
<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, sans-serif;
    }

    body{
        background:#f4f6f9;
    }

    .sidebar{
        width:250px;
        height:100vh;
        background:#2c3e50;
        position:fixed;
        color:white;
        padding-top:20px;
    }

    .sidebar h2{
        text-align:center;
        margin-bottom:30px;
    }

    .sidebar ul{
        list-style:none;
    }

    .sidebar ul li{
        padding:15px 20px;
        border-bottom:1px solid rgba(255,255,255,0.1);
    }

    .sidebar ul li a{
        text-decoration:none;
        color:white;
        display:block;
    }

    .sidebar ul li:hover{
        background:#34495e;
    }

    .main{
        margin-left:250px;
        padding:20px;
    }

    .header{
        background:white;
        padding:15px;
        border-radius:10px;
        box-shadow:0 2px 5px rgba(0,0,0,0.1);
        margin-bottom:20px;
    }

    .cards{
        display:grid;
        grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
        gap:20px;
    }

    .card{
        background:white;
        padding:20px;
        border-radius:10px;
        text-align:center;
        box-shadow:0 2px 5px rgba(0,0,0,0.1);
    }

    .card h3{
        margin-bottom:10px;
        color:#2c3e50;
    }

    .card button{
        padding:10px 15px;
        border:none;
        background:#3498db;
        color:white;
        border-radius:5px;
        cursor:pointer;
    }

    .card button:hover{
        background:#2980b9;
    }
</style>
</head>
<body>

<div class="sidebar">
    <h2>Student Panel</h2>
    <ul>
        <li><a href="#">View Books</a></li>
        <li><a href="#">Search Book</a></li>
        <li><a href="#">Books by Category</a></li>
        <li><a href="#">Borrow Book</a></li>
        <li><a href="#">Return Book</a></li>
        <li><a href="#">Logout</a></li>
    </ul>
</div>

<div class="main">
    <div class="header">
        <h1>Student Dashboard</h1>
    </div>

    <div class="cards">
        <div class="card">
            <h3>View Books</h3>
            <button>Open</button>
        </div>

        <div class="card">
            <h3>Search Book</h3>
            <button>Open</button>
        </div>

        <div class="card">
            <h3>Books by Category</h3>
            <button>Open</button>
        </div>

        <div class="card">
            <h3>Borrow Book</h3>
            <button>Open</button>
        </div>

        <div class="card">
            <h3>Return Book</h3>
            <button>Open</button>
        </div>
    </div>
</div>

</body>
</html>
